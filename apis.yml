name: Aspinity
description: Aspinity is a Pittsburgh, Pennsylvania semiconductor company that develops analog machine
  learning (AnalogML) technology combining ultra-low-power analog signal processing with machine learning
  for always-on, battery-operated edge AI event detection and classification. Its analogML processors
  the AML100 and next-generation AML200 deliver TOPS-level inference in a microwatt power footprint,
  targeting automotive vehicle-security monitoring, smart-home sensing such as glass-break and water-leak
  detection, and IoT applications including voice and keyword detection and vibration monitoring. Aspinity
  is a hardware and semiconductor provider and does not currently publish a public developer API, SDK, or
  developer portal; this profile tracks its public web and security posture in the API Evangelist network.
